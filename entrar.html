<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ConnectTruck</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    
    <main class="container-login">
        
        <div class="brilho-titulo">
            <h1>Bem-Vindo(a)</h1>
        </div>

        <form class="formulario-login">
            <input type="email" placeholder="Digite seu Email" required>
            <input type="password" placeholder="Digite sua Senha" required>
            <button type="submit">Entrar</button>
        </form>

        <a href="#" class="esqueci-senha">Esqueceu a senha?</a>

        <div class="opcoes-cadastro">
            <p>Não tem conta? <a href="#">Cadastrar</a></p>
            <p>Entrar como <a href="#">Pessoa Jurídica</a></p>
        </div>

    </main>

    <div class="container-logo">
        <img src="images/ConnectTruck-Logo.png" alt="Logo ConnectTruck">
    </div>

</body>
</html>
