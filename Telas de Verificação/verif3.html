<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectTruck - Reconhecimento Facial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0B1E2C; /* Moldura escura externa */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #d9d9d9; /* Fundo cinza claro */
            width: 100%;
            max-width: 1000px;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        /* Topbar / Header Completo */
        .header {
            background-color: #ffffff;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            color: #1c2434;
            gap: 10px;
        }

        /* Estilização da Logo adaptada para a imagem real na pasta assets */
        .logo img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        /* Menu de Navegação */
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link {
            text-decoration: none;
            color: #1c2434;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-blue {
            background-color: #2b5cb3;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-teal {
            background-color: #129a98;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Conteúdo Principal */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            text-align: center;
        }

        .title {
            font-size: 36px;
            color: #1a1a1a;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 24px;
            color: #2c2c2c;
            font-weight: 600;
            margin-bottom: 35px;
        }

        /* Avatar Central Grande */
        .avatar-main {
            width: 130px;
            height: 130px;
            background-color: #fcd434;
            border-radius: 50%;
            margin-bottom: 40px;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Elementos minimalistas para simular o rosto */
        .avatar-face {
            width: 50px;
            height: 65px;
            background-color: #ffccd5;
            border-radius: 25px;
            position: absolute;
            bottom: 25px;
        }

        .avatar-hair {
            width: 60px;
            height: 45px;
            background-color: #e45a86;
            border-radius: 30px 30px 0 0;
            position: absolute;
            top: 30px;
        }

        .avatar-body {
            width: 80px;
            height: 40px;
            background-color: #4ed3ad;
            border-radius: 40px 40px 0 0;
            position: absolute;
            bottom: 0;
        }

        /* Grid de Instruções Inferiores */
        .instructions-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            max-width: 800px;
            width: 100%;
            margin-bottom: 40px;
        }

        .instruction-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 200px;
        }

        /* Mini Avatares */
        .avatar-mini {
            width: 55px;
            height: 55px;
            background-color: #fcd434;
            border-radius: 50%;
            border: 1px solid #b5b5b5;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Variação 2: Desfocado */
        .blur-effect {
            filter: blur(3px);
        }

        /* Variação 3: Óculos de sol */
        .glasses::after {
            content: '';
            position: absolute;
            top: 42%;
            width: 24px;
            height: 7px;
            background-color: #1a1a1a;
            border-radius: 2px;
            z-index: 10;
        }

        .instruction-text {
            font-size: 12px;
            color: #1a1a1a;
            line-height: 1.4;
            font-weight: 500;
        }

        /* Botão Iniciar */
        .btn-start {
            background-color: #2d2d2d;
            color: #ffffff;
            border: none;
            padding: 14px 80px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            margin-top: 10px;
        }

        .btn-start:hover {
            background-color: #1a1a1a;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            .instructions-container {
                flex-direction: column;
                align-items: center;
                gap: 25px;
            }
            .title {
                font-size: 26px;
            }
            .subtitle {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
       <header class="header">
    <div class="logo">
        <img src="assets/Logo.png" alt="Logo ConnectTruck">
        ConnectTruck
    </div>
</header>

        <main class="main-content">

            <h2 class="subtitle">Reconhecimento facial</h2>
            
            <div class="avatar-main">
                <div class="avatar-hair"></div>

            <div class="instructions-container">
                
                <div class="instruction-item">
                    <div class="avatar-mini">
                        <div class="avatar-hair" style="width:26px; height:20px; top:12px;"></div>
                        <div class="avatar-face" style="width:22px; height:28px; bottom:12px;"></div>
                        <div class="avatar-body" style="width:36px; height:18px;"></div>

                <div class="instruction-item">

                        <div class="avatar-face" style="width:22px; height:28px; bottom:12px;"></div>
                        <div class="avatar-body" style="width:36px; height:18px;"></div>
                    </div>
                    <p class="instruction-text">Certifique-se de que a iluminação é clara</p>
                </div>

                <div class="instruction-item">
                    <div class="avatar-mini glasses">
                        <div class="avatar-hair" style="width:26px; height:20px; top:12px;"></div>
                        <div class="avatar-face" style="width:22px; height:28px; bottom:12px;"></div>
                        <div class="avatar-body" style="width:36px; height:18px;"></div>
                    </div>
                    <p class="instruction-text">Não use óculos de sol nem chapéu</p>
                </div>

            </div>

           <a href="verif4.html" class="btn-start" style="display: inline-block; text-align: center; text-decoration: none;">
    Iniciar reconhecimento
</a>
        </main>
    </div>

</body>
</html>
