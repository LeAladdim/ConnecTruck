<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ConnectTruck</title>
    <style>
        /* ==========================================================================
           PARTE 1: ESTILOS (login.css integrado e corrigido para a pasta assets)
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            /* Imagem de fundo apontando para a pasta assets */
            background-image: url('assets/c108dad7-9984-4ae6-88dd-fc3641d8e410.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 0;
        }

        .container-login {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            z-index: 1; 
            padding: 20px;
        }

        .brilho-titulo {
            background: radial-gradient(circle, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 70%);
            padding: 30px 80px;
            margin-bottom: 10px;
            border-radius: 50%;
            text-align: center;
        }

        .brilho-titulo h1 {
            color: #1a1a1a;
            font-size: 32px;
            font-weight: 700;
            white-space: nowrap;
        }

        .formulario-login {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        .formulario-login input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .formulario-login input:focus {
            border-color: #004b75;
        }

        .formulario-login button {
            width: 100%;
            padding: 15px;
            background-color: #004b75;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .formulario-login button:hover {
            background-color: #063959;
        }

        .esqueci-senha {
            color: #6fb5e0;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 30px;
            z-index: 1;
        }

        .esqueci-senha:hover {
            text-decoration: underline;
        }

        .opcoes-cadastro {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px 35px;
            border-radius: 15px;
            text-align: center;
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            width: 100%;
        }

        .opcoes-cadastro p {
            color: #000;
            margin: 5px 0;
            font-weight: 700;
        }

        .opcoes-cadastro a {
            color: #004b75;
            text-decoration: none;
        }

        .opcoes-cadastro a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    
    <main class="container-login">
        
        <div class="brilho-titulo">
            <h1>Bem-Vindo(a)</h1>
        </div>

        <form class="formulario-login" id="login-form">
            <input type="email" placeholder="Digite seu Email" id="email-input" required>
            <input type="password" placeholder="Digite sua Senha" id="senha-input" required>
            <button type="submit">Entrar</button>
        </form>

        <a href="#" class="esqueci-senha">Esqueceu a senha?</a>

        <div class="opcoes-cadastro">
            <p>Não tem conta? <a href="#">Cadastrar</a></p>
            <p>Entrar como <a href="#">Pessoa Jurídica</a></p>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById('login-form');
            const emailInput = document.getElementById('email-input');
            const senhaInput = document.getElementById('senha-input');

            if (form) {
                form.addEventListener('submit', (event) => {
                    // Impede o recarregamento automático da página
                    event.preventDefault();

                    const email = emailInput ? emailInput.value.trim() : "";
                    const senha = senhaInput ? senhaInput.value.trim() : "";

                    // Validação simples de preenchimento
                    if (email === "" || senha === "") {
                        alert("Por favor, preencha todos os campos obrigatórios!");
                        return;
                    }

                    // Validação básica do tamanho da senha
                    if (senha.length < 6) {
                        alert("A senha deve conter pelo menos 6 caracteres!");
                        return;
                    }

                    // Simulação de sucesso
                    alert(`Tentativa de login efetuada para: ${email}`);
                });
            }
        });
    </script>

</body>
</html>
